name: Release Gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD/.github/workflows:/workflows:ro" rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 /workflows/ci.yml /workflows/release-gate.yml /workflows/release.yml

  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - if: matrix.node-version == 22
        run: npm audit --audit-level=high
      - if: matrix.node-version == 22
        run: npm run test:load
      - if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: bounded-load-${{ github.run_id }}-${{ github.run_attempt }}-node22
          path: artifacts/load/
          if-no-files-found: error

  ram-live:
    needs: [actionlint, verify-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ram-release
    concurrency:
      group: ram-release-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require RAM release credentials
        env:
          AGENT_MEMORY_ENDPOINT: ${{ secrets.AGENT_MEMORY_ENDPOINT }}
          AGENT_MEMORY_API_KEY: ${{ secrets.AGENT_MEMORY_API_KEY }}
          AGENT_MEMORY_STORE_ID: ${{ secrets.AGENT_MEMORY_STORE_ID }}
        run: node scripts/require-env.mjs AGENT_MEMORY_ENDPOINT AGENT_MEMORY_API_KEY AGENT_MEMORY_STORE_ID
      - name: Run RAM live suite twice without skips
        env:
          AGENT_MEMORY_ENDPOINT: ${{ secrets.AGENT_MEMORY_ENDPOINT }}
          AGENT_MEMORY_API_KEY: ${{ secrets.AGENT_MEMORY_API_KEY }}
          AGENT_MEMORY_STORE_ID: ${{ secrets.AGENT_MEMORY_STORE_ID }}
        run: npm run test:integration:release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-live-${{ github.run_id }}-${{ github.run_attempt }}-node22
          path: artifacts/ram-live/
          if-no-files-found: error

  self-hosted-live:
    needs: [actionlint, verify-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ram-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require extraction credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/require-env.mjs OPENAI_API_KEY
      - name: Start pinned self-hosted memory server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker run -d --name agent-memory-release -e OPENAI_API_KEY -p 8000:8000 redislabs/agent-memory-server:0.14.0-standalone@sha256:6f7c708261fc76040271ef24f84b57f8debfc86131d57dd6a71618d51386e67c
      - name: Wait for self-hosted health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            echo "Waiting for self-hosted health (${attempt}/60)"
            sleep 2
          done
          docker logs agent-memory-release
          exit 1
      - name: Run self-hosted live regression
        env:
          AGENT_MEMORY_SERVER_URL: http://127.0.0.1:8000
          OPENCLAW_LIVE_TEST: '1'
        run: npm test -- src/index.test.ts
      - if: always()
        run: docker rm -f agent-memory-release || true
