name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD/.github/workflows:/workflows:ro" rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 /workflows/ci.yml /workflows/release-gate.yml /workflows/release.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test packed package as a consumer
        run: npm run test:package

      - name: Audit production and development dependencies
        if: matrix.node-version == 22
        run: npm audit --audit-level=high

  integration-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The cloud integration suite self-skips when the AGENT_MEMORY_* secrets are
    # unset (e.g. on fork PRs, where secrets are empty), so this job is safe to
    # run unconditionally — it just becomes a no-op that reports skipped tests.
    # A single global concurrency group serializes runs so two PRs never
    # interleave writes into the shared cloud store (Story 06's unique-namespace
    # isolation is the primary defense; this is belt-and-braces).
    concurrency:
      group: ram-cloud-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cloud integration tests
        env:
          AGENT_MEMORY_ENDPOINT: ${{ secrets.AGENT_MEMORY_ENDPOINT }}
          AGENT_MEMORY_API_KEY: ${{ secrets.AGENT_MEMORY_API_KEY }}
          AGENT_MEMORY_STORE_ID: ${{ secrets.AGENT_MEMORY_STORE_ID }}
        run: npm run test:integration
